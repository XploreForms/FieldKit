<script>
/* tab icon: when the page is shown inside another document wrapper, its <head> links can land in the body,
   where browsers skip them; copy them into the real head */
(function () {
  try {
    var h = document.head; if (!h) return;
    [].forEach.call(document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]'), function (l) {
      if (l.parentNode === h) return;
      var c = document.createElement('link'); c.rel = l.rel; if (l.type) c.type = l.type;
      if (l.getAttribute('sizes')) c.setAttribute('sizes', l.getAttribute('sizes')); c.href = l.href;
      h.appendChild(c);
    });
  } catch (e) {}
})();
/* colour mode before the first paint: Field Kit settings save it (light by default; black = dark + OLED) */
(function () {
  var t = null, o = false;
  try { t = localStorage.getItem('xplore_fsl_theme'); o = localStorage.getItem('xplore_fsl_oled') === 'on'; } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = 'light';   // light (white background) by default
  document.documentElement.setAttribute('data-fn-theme', t);
  if (o) document.documentElement.setAttribute('data-oled', 'on');
  var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', o && t === 'dark' ? '#000000' : '#002B2B');
})();
</script>
<style>


:root {
  /* Xplore brand palette (Brand Guide, Sept 2022), RGB for anything viewed digitally */
  --xp-dark:       #002B2B;   /* North Shore Green 0/43/43 : page background */
  --xp-carmanah:   #306154;   /* Carmanah Green 48/97/84   : tiles, boxes, panels */
  --xp-green:      #58C774;   /* Superior Green 88/199/116 : picked state, rules, section titles */
  --xp-solar:      #00FF57;   /* Solar Wind 0/255/87       : used sparingly (digital only) */
  --xp-white:      #FFFFFF;
  --xp-orange:     #FFB21C;   /* contrast colour: unanswered marker only */
  --xp-font: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
/* Approved pairings only: on North Shore or Carmanah use Superior, Solar Wind or White text;
   on Superior or Solar Wind use North Shore text. */

html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); color-scheme: dark; background: var(--xp-dark); }

*, *::before, *::after { box-sizing: border-box; }

/* no double-tap zoom or tap delay when tapping choices quickly */
button, input, textarea { touch-action: manipulation; }

body {
  font-family: var(--xp-font);
  color: var(--xp-white);
  background: var(--xp-dark);
  margin: 0;
  padding: 0;
  padding-bottom: 12rem;
  line-height: 1.5;
}

h1, h2, h3 { color: var(--xp-white); margin: 0; letter-spacing: -0.01em; }
h1 { font-weight: 700; font-size: 1.15rem; }
h2 { font-weight: 600; font-size: 1.05rem; }

.wrap { max-width: 44rem; margin: 0 auto; padding: 1.1rem 0.9rem 0; }
.hidden { display: none !important; }

/* header: North Shore Green with the Superior Green logo, a quiet Carmanah rule underneath */
header.app-header {
  background: var(--xp-dark); color: var(--xp-white);
  padding: calc(1rem + env(safe-area-inset-top, 0px)) 0 1.1rem;
  border-bottom: 2px solid var(--xp-carmanah);
}
.app-header-inner { max-width: 44rem; margin: 0 auto; padding: 0 0.9rem; }   /* same box as .wrap, so the left edges match at any width */
header.app-header img { width: 7.5rem; height: auto; display: block; }
header.app-header h1 { color: var(--xp-white); font-size: 1.3rem; line-height: 1.25; margin-top: 0.85rem; }
header.app-header p { margin: 0.3rem 0 0; font-size: 0.9rem; line-height: 1.4; color: var(--xp-white); }

.link-btn {
  font-family: var(--xp-font); font-weight: 600; font-size: 0.85rem;
  color: var(--xp-white); background: var(--xp-dark);
  border: 2px solid transparent; border-radius: 0.6rem;
  padding: 0.55rem 0.9rem; min-height: 2.8rem; cursor: pointer;
}

.notice {
  background: var(--xp-carmanah); border-left: 0.4rem solid var(--xp-orange);
  border-radius: 0.8rem; padding: 0.7rem 0.9rem; font-size: 0.9rem; margin-bottom: 1rem;
  display: flex; gap: 0.7rem; align-items: center; justify-content: space-between; flex-wrap: wrap;
}

/* the technician box is a small panel; the form itself sits straight on the page */
.card { margin-bottom: 1rem; }
.card.tech-card { background: var(--xp-carmanah); border-radius: 1rem; padding: 0.9rem; }
.card.tech-card input[type="text"] { background: var(--xp-dark); }
.card-title { margin-bottom: 1.2rem; }

.form-section { margin-bottom: 2.2rem; }
.form-section:last-child { margin-bottom: 0; }
.form-section-title {
  font-size: 1.05rem; font-weight: 600; color: var(--xp-green);
  padding-bottom: 0.5rem; margin-bottom: 1.1rem; border-bottom: 1px solid var(--xp-carmanah);
}

.field { margin-bottom: 1.7rem; padding: 0.2rem 0; scroll-margin-top: 1rem; }
.field:last-child { margin-bottom: 0; }
.q { display: block; font-weight: 600; font-size: 1.05rem; margin-bottom: 0.45rem; color: var(--xp-white); }
.q .opt, .form-section-title .opt { font-weight: 400; color: var(--xp-white); font-size: 0.9rem; }
.hint { font-size: 0.9rem; color: var(--xp-white); margin: 0 0 0.6rem; }
.sub-q { font-weight: 600; font-size: 0.95rem; margin: 0.9rem 0 0.4rem; }

/* choice buttons: Carmanah tiles, Superior Green when picked */
.choices { display: grid; gap: 0.6rem; grid-template-columns: 1fr; }
.choices.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choices.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choices.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.choices.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.choice {
  font-family: var(--xp-font); font-weight: 600; font-size: 1rem; line-height: 1.3;
  color: var(--xp-white); background: var(--xp-carmanah);
  border: 0; border-radius: 0.8rem;
  min-height: 3.5rem; padding: 0.7rem 0.8rem; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 0.6rem; position: relative;
  -webkit-tap-highlight-color: transparent;
}
.choices.cols-5 .choice, .choices.cols-4 .choice, .choices.cols-3 .choice, .choices.cols-2 .choice, .choices.cols-1 .choice { justify-content: center; text-align: center; }
.choice .mark {
  flex: 0 0 1.5rem; width: 1.5rem; height: 1.5rem; border-radius: 50%;
  border: 2px solid var(--xp-white); display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.95rem; line-height: 1;
}
.choices.cols-5 .choice .mark, .choices.cols-4 .choice .mark, .choices.cols-3 .choice .mark, .choices.cols-2 .choice .mark, .choices.cols-1 .choice .mark { display: none; }
.choices.cols-5 .choice, .choices.cols-4 .choice, .choices.cols-3 .choice, .choices.cols-2 .choice { padding-left: 0.35rem; padding-right: 0.35rem; }
.choices.cols-3 { gap: 0.45rem; }
.choices.cols-3 .choice { font-size: 0.88rem; padding-left: 0.2rem; padding-right: 0.2rem; }
@media (max-width: 340px) { .choices.cols-3 { grid-template-columns: minmax(0, 1fr); } }
.choices.cols-5, .choices.cols-4 { gap: 0.45rem; }
.choice:active { background: var(--xp-solar); color: var(--xp-dark); }
.choice[aria-checked="true"] { background: var(--xp-green); color: var(--xp-dark); }
.choice[aria-checked="true"] .mark { background: var(--xp-dark); border-color: var(--xp-dark); color: var(--xp-green); font-weight: 700; }
/* selected check for side-by-side buttons is a corner badge: it takes no space, so nothing resizes or re-wraps */
.choices.cols-5 .choice[aria-checked="true"]::after, .choices.cols-4 .choice[aria-checked="true"]::after,
.choices.cols-3 .choice[aria-checked="true"]::after,
.choices.cols-2 .choice[aria-checked="true"]::after {
  content: "\2713"; position: absolute; top: -0.5rem; right: -0.35rem; width: 1.4rem; height: 1.4rem; border-radius: 50%;
  background: var(--xp-dark); color: var(--xp-green); border: 2px solid var(--xp-green);
  font-size: 0.75rem; font-weight: 700; line-height: calc(1.4rem - 4px); text-align: center;
}

/* text inputs: Carmanah boxes with a Superior Green underline, white text */
input[type="text"], input[type="number"], textarea {
  width: 100%; font-family: var(--xp-font); font-size: 1.05rem; color: var(--xp-white);
  background: var(--xp-carmanah); border: 0; border-radius: 0.8rem; caret-color: var(--xp-solar);
  box-shadow: inset 0 -3px 0 var(--xp-green);
  padding: 0.85rem 0.9rem; min-height: 3.4rem; -webkit-appearance: none; appearance: none;
}
textarea { min-height: 6.5rem; resize: vertical; }
input:focus, textarea:focus, .choice:focus-visible, .link-btn:focus-visible, button:focus-visible {
  outline: 3px solid var(--xp-solar); outline-offset: 2px;
}
.other-input { margin-top: 0.9rem; padding-left: 0.8rem; border-left: 3px solid var(--xp-carmanah); }
.other-input .sub-q { margin-top: 0; }

.unit-row { display: flex; align-items: center; gap: 0.6rem; }
.field-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 0.9rem; }
.field-pair > .field { min-width: 0; }
.field-pair:not(:last-child) > .field, .field-pair:not(:last-child) > .field-pair > .field { margin-bottom: 1.7rem; }   /* a pair inside a section keeps the normal gap below it */
.checks-col { display: grid; }
/* long reason lists: compact and left-aligned so they scan like a list */
.choices.cols-list { gap: 0.35rem; }
.choices.cols-list .choice { justify-content: flex-start; text-align: left; min-height: 0; padding: 0.6rem 0.85rem; font-size: 0.9rem; }
.choices.cols-list .choice .mark { display: none; }
.tower-card { display: flex; flex-direction: column; gap: 1rem; border-radius: 0.9rem; padding: 0.9rem 0.9rem 1rem; margin-bottom: 1rem; box-shadow: inset 0 0 0 2px var(--xp-soft-line, #C7D9CF); }
.tower-card > *, .tower-card .field, .tower-card .field-pair > .field, .tower-card .field-pair > .field-pair > .field, .tower-card .mini-check-wrap { margin: 0 !important; }
.tower-card .field { padding: 0; }
.tower-card-head { display: flex; align-items: center; justify-content: space-between; font-weight: 700; margin-bottom: -0.25rem !important; }
.tower-card-head { gap: 0.6rem; }
.tower-card-title { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tower-card-head .tower-remove { font: inherit; font-size: 1rem; font-weight: 700; background: none; border: 0; color: inherit; opacity: 0.6; width: 2rem; height: 2rem; margin: -0.3rem -0.4rem -0.3rem -0.2rem; border-radius: 50%; cursor: pointer; flex: 0 0 auto; }
.nosig-pill { flex: 0 0 auto; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.4rem; font: inherit; font-size: 0.85rem; font-weight: 600; color: inherit; background: transparent; border: 0; border-radius: 999px; padding: 0.35rem 0.7rem 0.35rem 0.45rem; box-shadow: inset 0 0 0 2px var(--xp-soft-line, #C7D9CF); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.nosig-pill .box { width: 1.05rem; height: 1.05rem; border-radius: 0.3rem; box-shadow: inset 0 0 0 2px currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; line-height: 1; }
.nosig-pill.on { background: var(--xp-green, #58C774); color: var(--xp-dark, #002B2B); box-shadow: none; }
.nosig-pill.on .box { box-shadow: inset 0 0 0 2px var(--xp-dark, #002B2B); }
[data-field-id="no_coverage"] .mini-check-wrap { margin-top: 0; }
.add-tower { width: 100%; margin-bottom: 1.7rem; justify-content: center; }
.time-pair { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0.9rem; }
.time-pair input.time-input { width: 100%; box-sizing: border-box; min-height: 2.9rem; }
.field-pair.under-right > .field:nth-child(3) { grid-column: 2; }   /* e.g. Cell ID under Platform */
.field-pair.tight { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 0.8rem; }   /* readings sit close together, wrapping on very narrow phones */
.field-pair.tight > .field { flex: 0 0 auto; }
.field-pair.tight > .field input[type="text"]:not(.light-input) { width: 6.5rem; }
.field-pair.tight .unit-row input.light-input { flex-basis: 4rem; width: 4rem; }
.field-pair > .field-pair { min-width: 0; }
.field-pair.mini { flex-wrap: nowrap; gap: 0 0.6rem; }   /* two readings squeezed into half a row */
.field-pair.mini .unit-row { gap: 0.25rem; }
.field-pair.mini > .field { flex: 1 1 auto; min-width: 0; }   /* the two readings share the half row */
.field-pair.mini .unit-row input.light-input { flex: 1 1 auto; width: 2.7rem; min-width: 2.7rem; padding-left: 0.2rem; padding-right: 0.2rem; }
.field-pair.mini .unit-row .prefix, .field-pair.mini .unit-row .suffix { font-size: 0.9rem; }
.field-pair.mini .q { white-space: nowrap; }
.field-pair .unit-row { gap: 0.4rem; }
.field-pair .unit-row input.light-input { flex: 0 1 4.6rem; width: 4.6rem; min-width: 3.2rem; }
.field-pair .hint { display: none; }
.unit-row .prefix, .unit-row .suffix { font-weight: 600; font-size: 1.05rem; }
/* a minus that sits inside the box (RSRP, light level): overlaid on the input's left edge */
.unit-row { --ug: 0.6rem; }
.field-pair .unit-row { --ug: 0.4rem; }
.field-pair.mini .unit-row { --ug: 0.25rem; }
.neg-wrap { position: relative; display: inline-flex; box-sizing: border-box; }
/* the wrapper takes the box's size; the box fills it */
.unit-row .neg-wrap { flex: 0 0 6rem; width: 6rem; }
.field-pair .unit-row .neg-wrap { flex: 0 1 4.6rem; width: 4.6rem; min-width: 3.2rem; }
.field-pair.tight .unit-row .neg-wrap { flex-basis: 4rem; width: 4rem; }
.field-pair.mini .unit-row .neg-wrap { flex: 1 1 auto; width: 2.7rem; min-width: 4.1rem; }   /* room for the soft minus ahead of 3 digits */
.neg-wrap > input.light-input { flex: 1 1 auto !important; width: 100% !important; min-width: 0 !important; }
.neg-wrap > input.light-input.has-neg { padding-left: 0.85em; }   /* nudge the digits right so the minus and digits sit centred together */
/* the minus: softer than the digits, just ahead of a 2-3 digit reading, never typed */
.neg-wrap .neg-in { position: absolute; top: 50%; right: calc(50% + 0.95em); transform: translateY(-52%); font-size: 1.05rem; font-weight: 400; color: var(--xp-carmanah); opacity: 0.55; pointer-events: none; line-height: 1; }
/* the minus shows in an empty box, so techs see they only type the digits */
.unit-row input.light-input { flex: 0 0 6rem; width: 6rem; text-align: center; font-size: 1.05rem; font-weight: 400; padding: 0.85rem 0.4rem; }

.warn {
  margin-top: 0.7rem; background: var(--xp-carmanah); border-left: 0.4rem solid var(--xp-orange);
  border-radius: 0.8rem; padding: 0.7rem 0.9rem; font-size: 0.9rem;
}
.warn .choices { margin-top: 0.6rem; }
.warn .choice { background: var(--xp-dark); }
.warn .choice[aria-checked="true"] { background: var(--xp-green); }

/* photo checklist */
.photo-head { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
.photo-count { font-weight: 600; font-size: 0.95rem; }
.check {
  display: flex; align-items: center; gap: 0.7rem; width: 100%;
  font-family: var(--xp-font); font-weight: 600; font-size: 0.95rem; text-align: left;
  color: var(--xp-white); background: var(--xp-carmanah);
  border: 0; border-radius: 0.8rem;
  min-height: 2.9rem; padding: 0.35rem 0.8rem; margin-bottom: 0.35rem; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.check .box {
  flex: 0 0 1.5rem; width: 1.5rem; height: 1.5rem; border: 2px solid var(--xp-white); border-radius: 0.35rem;
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; line-height: 1;
}
.check[aria-checked="true"] { background: var(--xp-green); color: var(--xp-dark); }
.check[aria-checked="true"] .box { background: var(--xp-dark); border-color: var(--xp-dark); color: var(--xp-green); }

/* install-location groups (ONT, router, each XWH): no box, just a quiet Carmanah rule down the side */
.device-card { border-left: 3px solid var(--xp-carmanah); padding: 0; margin-bottom: 1.8rem; }
.device-head { padding: 0.1rem 0.9rem 0.2rem; }
.device-head .q { margin: 0; }
.device-body { padding: 0.4rem 0.9rem 0.4rem; }
.device-rule { border: 0; margin: 0.4rem 0 0; }
.device-body .light-block { margin: 0.9rem 0 0; padding: 0; }
.device-body .light-block.has-error { padding-left: 0.4rem; margin-left: -0.9rem; margin-top: 0.9rem; }
.field.device-card.has-error { border-left: 0.5rem solid var(--xp-orange); padding-left: 0; margin-left: 0; }

/* discreet tick box (own router, splice already done, reused patch) */
.mini-check-wrap { margin-top: 1rem; padding-top: 0.2rem; }
.mini-check-wrap + .mini-check-wrap { margin-top: 0.15rem; }   /* ticks under one question sit together */
.mini-check {
  display: flex; align-items: center; gap: 0.6rem; width: 100%; min-height: 2.9rem; padding: 0.3rem 0;
  font-family: var(--xp-font); font-weight: 400; font-size: 0.95rem; text-align: left; color: var(--xp-white);
  background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.mini-box {
  flex: 0 0 1.4rem; width: 1.4rem; height: 1.4rem; border: 2px solid var(--xp-white); border-radius: 0.3rem;
  display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; line-height: 1;
}
.mini-check[aria-checked="true"] .mini-box { background: var(--xp-green); border-color: var(--xp-green); color: var(--xp-dark); }

/* validation */
.field.has-error { border-left: 0.4rem solid var(--xp-orange); padding-left: 0.4rem; margin-left: -0.8rem; }
.field-error-msg { font-weight: 600; font-size: 0.9rem; margin-top: 0.5rem; }
.field-error-msg::before { content: "\26A0  "; color: var(--xp-orange); }


/* must-explain box for missing photos */
.need-reason {
  margin-top: 0.8rem; background: var(--xp-carmanah); border-left: 0.5rem solid var(--xp-orange);
  border-radius: 0.8rem; padding: 0.9rem;
}
.need-reason strong { display: block; font-size: 1.05rem; margin-bottom: 0.4rem; }
.need-reason textarea { background: var(--xp-dark); box-shadow: inset 0 -3px 0 var(--xp-orange); }

/* output */
#output-wrap { margin-top: 1.2rem; }
#output-box {
  background: var(--xp-carmanah); color: var(--xp-white); border-radius: 1rem; padding: 1rem;
  white-space: pre-wrap; font-size: 1rem; line-height: 1.55;
  -webkit-user-select: text; user-select: text;
}

/* buttons: Superior Green main button that brightens to Solar Wind once every answer is in */
button.btn {
  font-family: var(--xp-font); font-weight: 700; font-size: 1.1rem; border-radius: 0.8rem;
  padding: 0.9rem 1rem; min-height: 3.5rem; cursor: pointer; border: 0;
  -webkit-tap-highlight-color: transparent;
}
button.btn.primary { background: var(--xp-green); color: var(--xp-dark); }
button.btn.primary.ready { background: var(--xp-solar); }
button.btn.primary:active { background: var(--xp-solar); }
button.btn.secondary { background: var(--xp-carmanah); color: var(--xp-white); }
button.btn.secondary:active { background: var(--xp-green); color: var(--xp-dark); }
button.btn.done { background: var(--xp-green); color: var(--xp-dark); }

.sticky-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--xp-dark);
  box-shadow: 0 -10px 18px 4px var(--xp-dark);
  padding: 0.5rem 0 calc(0.5rem + env(safe-area-inset-bottom, 0px));
}
/* compact on purpose: it is always on screen */
.sticky-inner { max-width: 44rem; margin: 0 auto; padding: 0 0.9rem; display: grid; gap: 0.5rem; }
.sticky-inner .btn, .sticky-inner > .link-btn { white-space: nowrap; }
.sticky-inner .btn { min-height: 3.1rem; font-size: 1rem; padding: 0.55rem 0.8rem; }
.sticky-inner.edit { grid-template-columns: 1fr auto; }
.sticky-inner > .link-btn { background: var(--xp-carmanah); font-size: 0.8rem; min-height: 3.1rem; padding: 0 0.75rem; border-radius: 0.8rem; }
/* very narrow phones: stack the two buttons instead of squeezing them */
@media (max-width: 350px) { .sticky-inner.edit { grid-template-columns: 1fr; } .sticky-inner > .link-btn { min-height: 2.8rem; } }
.sticky-inner .row { display: flex; gap: 0.5rem; }
.sticky-inner .row .btn { flex: 1; min-height: 2.8rem; font-size: 0.9rem; }
.next-step { font-weight: 600; font-size: 0.95rem; margin: 0.8rem 0 0; }

/* confirm dialog */
.overlay { position: fixed; inset: 0; background: rgba(0,43,43,.88); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.dialog { background: var(--xp-dark); color: var(--xp-white); border: 2px solid var(--xp-carmanah); border-radius: 1rem; padding: 1.2rem; max-width: 26rem; width: 100%; }
.dialog p { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem; }
.dialog .row { display: grid; gap: 0.6rem; }

footer.app-footer { margin-top: 2rem; padding-top: 0.8rem; font-size: 0.75rem; color: var(--xp-green); text-align: center; }

/* phone held sideways: put the bottom buttons side by side so they don't eat the screen */
@media (max-height: 520px) {
  .sticky-inner.output { grid-template-columns: repeat(3, 1fr); }
  .sticky-inner.output .row { display: contents; }
  .sticky-inner.output .row .btn { min-height: 3.1rem; font-size: 1rem; }
}

/* ---- theme switch (sits in the North Shore header, so it looks the same in both themes) ---- */
.header-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.theme-switch {
  display: inline-flex; align-items: center; gap: 0.55rem; min-height: 2.75rem; padding: 0 0.2rem 0 0.6rem;
  font-family: var(--xp-font); font-weight: 600; font-size: 0.85rem; color: var(--xp-white);
  background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.ts-track { position: relative; width: 3rem; height: 1.7rem; border-radius: 1rem; background: var(--xp-carmanah); flex: 0 0 auto; transition: background .15s; }
.ts-knob { position: absolute; top: 0.2rem; left: 0.2rem; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--xp-white); transition: transform .15s; }
.theme-switch[aria-checked="true"] .ts-track { background: var(--xp-green); }
.theme-switch[aria-checked="true"] .ts-knob { transform: translateX(1.3rem); background: var(--xp-dark); }

/* ---- light theme: white page, North Shore text, Carmanah outlines, picked = North Shore ---- */
:root[data-fn-theme="light"] { color-scheme: light; --xp-line: var(--xp-carmanah); }
:root[data-fn-theme="light"] { background: var(--xp-white); }
:root[data-fn-theme="light"] body { background: var(--xp-white); color: var(--xp-dark); }
:root[data-fn-theme="light"] h1, :root[data-fn-theme="light"] h2, :root[data-fn-theme="light"] h3 { color: var(--xp-dark); }
:root[data-fn-theme="light"] header.app-header h1, :root[data-fn-theme="light"] header.app-header p { color: var(--xp-white); }
:root[data-fn-theme="light"] .q, :root[data-fn-theme="light"] .q .opt, :root[data-fn-theme="light"] .hint, :root[data-fn-theme="light"] .form-section-title .opt { color: var(--xp-dark); }
:root[data-fn-theme="light"] .form-section-title { color: var(--xp-carmanah); border-bottom-color: var(--xp-carmanah); }
:root[data-fn-theme="light"] .link-btn { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-fn-theme="light"] .notice, :root[data-fn-theme="light"] .card.tech-card { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-fn-theme="light"] .notice { border-left-color: var(--xp-orange); }
:root[data-fn-theme="light"] .choice, :root[data-fn-theme="light"] .check { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-fn-theme="light"] .choice:active, :root[data-fn-theme="light"] .check:active { background: var(--xp-solar); color: var(--xp-dark); }
:root[data-fn-theme="light"] .choice[aria-checked="true"], :root[data-fn-theme="light"] .check[aria-checked="true"] { background: var(--xp-dark); color: var(--xp-white); box-shadow: none; }
:root[data-fn-theme="light"] .choice .mark { border-color: var(--xp-dark); }
:root[data-fn-theme="light"] .choice[aria-checked="true"] .mark { background: var(--xp-white); border-color: var(--xp-white); color: var(--xp-dark); }
:root[data-fn-theme="light"] .check .box { border-color: var(--xp-dark); }
:root[data-fn-theme="light"] .check[aria-checked="true"] .box { background: var(--xp-green); border-color: var(--xp-green); color: var(--xp-dark); }
:root[data-fn-theme="light"] input[type="text"], :root[data-fn-theme="light"] input[type="number"], :root[data-fn-theme="light"] textarea,
:root[data-fn-theme="light"] .card.tech-card input[type="text"] { background: var(--xp-white); color: var(--xp-dark); caret-color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-fn-theme="light"] input:focus, :root[data-fn-theme="light"] textarea:focus { box-shadow: inset 0 0 0 2px var(--xp-dark); outline: 3px solid var(--xp-green); outline-offset: 2px; }
:root[data-fn-theme="light"] .choice:focus-visible, :root[data-fn-theme="light"] .link-btn:focus-visible, :root[data-fn-theme="light"] button:focus-visible { outline-color: var(--xp-dark); }
:root[data-fn-theme="light"] .other-input { border-left-color: var(--xp-carmanah); }
:root[data-fn-theme="light"] .warn, :root[data-fn-theme="light"] .need-reason { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-fn-theme="light"] .warn .choice { background: var(--xp-white); }
:root[data-fn-theme="light"] .warn .choice[aria-checked="true"] { background: var(--xp-dark); }
:root[data-fn-theme="light"] .need-reason textarea { background: var(--xp-white); box-shadow: inset 0 0 0 3px var(--xp-orange); }
:root[data-fn-theme="light"] .mini-check { color: var(--xp-dark); }
:root[data-fn-theme="light"] .mini-box { border-color: var(--xp-dark); }
:root[data-fn-theme="light"] .mini-check[aria-checked="true"] .mini-box { background: var(--xp-dark); border-color: var(--xp-dark); color: var(--xp-white); }
:root[data-fn-theme="light"] #output-box { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-fn-theme="light"] button.btn.primary { background: var(--xp-dark); color: var(--xp-white); }
:root[data-fn-theme="light"] button.btn.primary.ready { background: var(--xp-green); color: var(--xp-dark); }
:root[data-fn-theme="light"] button.btn.primary:active { background: var(--xp-solar); color: var(--xp-dark); }
:root[data-fn-theme="light"] button.btn.secondary { background: var(--xp-white); color: var(--xp-dark); box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-fn-theme="light"] button.btn.done { background: var(--xp-green); color: var(--xp-dark); }
:root[data-fn-theme="light"] .sticky-bar { background: var(--xp-white); box-shadow: 0 -10px 18px 4px var(--xp-white); }
:root[data-fn-theme="light"] .sticky-inner > .link-btn { background: var(--xp-white); }
:root[data-fn-theme="light"] .dialog { background: var(--xp-white); color: var(--xp-dark); border-color: var(--xp-carmanah); }
:root[data-fn-theme="light"] footer.app-footer { color: var(--xp-carmanah); }

/* ---- light theme, option A "soft mint" (chosen by the owner): pale mint page, white tiles with a soft shadow, picked = Superior Green ---- */
:root[data-fn-theme="light"] { --xp-mint: #F2F8F4; --xp-soft-line: #C7D9CF; --xp-lift: 0 1px 3px rgba(0,43,43,.22); background: var(--xp-mint); }
:root[data-fn-theme="light"] body { background: var(--xp-mint); }
:root[data-fn-theme="light"] .choice, :root[data-fn-theme="light"] .check, :root[data-fn-theme="light"] .link-btn, :root[data-fn-theme="light"] button.btn.secondary, :root[data-fn-theme="light"] .notice, :root[data-fn-theme="light"] .card.tech-card, :root[data-fn-theme="light"] .warn, :root[data-fn-theme="light"] .need-reason, :root[data-fn-theme="light"] #output-box, :root[data-fn-theme="light"] .warn .choice { background: var(--xp-white); box-shadow: var(--xp-lift); }
:root[data-fn-theme="light"] input[type="text"], :root[data-fn-theme="light"] input[type="number"], :root[data-fn-theme="light"] textarea, :root[data-fn-theme="light"] .card.tech-card input[type="text"] { background: var(--xp-white); box-shadow: inset 0 0 0 2px var(--xp-soft-line); }
:root[data-fn-theme="light"] input:focus, :root[data-fn-theme="light"] textarea:focus { box-shadow: inset 0 0 0 2px var(--xp-carmanah); }
:root[data-fn-theme="light"] .need-reason textarea { box-shadow: inset 0 0 0 3px var(--xp-orange); }
:root[data-fn-theme="light"] .choice[aria-checked="true"], :root[data-fn-theme="light"] .check[aria-checked="true"], :root[data-fn-theme="light"] .warn .choice[aria-checked="true"] { background: var(--xp-green); color: var(--xp-dark); box-shadow: none; }
:root[data-fn-theme="light"] .choice[aria-checked="true"] .mark, :root[data-fn-theme="light"] .check[aria-checked="true"] .box { background: var(--xp-dark); border-color: var(--xp-dark); color: var(--xp-green); }
:root[data-fn-theme="light"] .choices.cols-2 .choice[aria-checked="true"]::after, :root[data-fn-theme="light"] .choices.cols-3 .choice[aria-checked="true"]::after, :root[data-fn-theme="light"] .choices.cols-5 .choice[aria-checked="true"]::after, :root[data-fn-theme="light"] .choices.cols-4 .choice[aria-checked="true"]::after { background: var(--xp-dark); border-color: var(--xp-mint); color: var(--xp-green); }
:root[data-fn-theme="light"] .mini-check[aria-checked="true"] .mini-box { background: var(--xp-green); border-color: var(--xp-green); color: var(--xp-dark); }
:root[data-fn-theme="light"] .form-section-title { border-bottom-color: var(--xp-soft-line); }
:root[data-fn-theme="light"] .sticky-bar { background: var(--xp-mint); box-shadow: 0 -10px 18px 4px var(--xp-mint); }
:root[data-fn-theme="light"] .sticky-inner > .link-btn { background: var(--xp-white); }

/* =====================================================================================
   v2.6: live comment, progress, toasts, settings, change log, extras
   ===================================================================================== */
:root { --xp-green-rgb: 88,199,116; --xp-dark-rgb: 0,43,43; --bar-h: 5rem; }
body { padding-bottom: 6rem; }

/* sections and questions slide in and out instead of jumping */
.slide-in { animation: xp-slide-in 0.32s ease-out both; overflow: hidden; }
@keyframes xp-slide-in { from { opacity: 0; max-height: 0; transform: translateY(-8px); } to { opacity: 1; max-height: 80rem; transform: none; } }
.slide-out { animation: xp-slide-out 0.28s ease-in both; overflow: hidden; pointer-events: none; }
@keyframes xp-slide-out { from { opacity: 1; max-height: var(--h, 20rem); } to { opacity: 0; max-height: 0; margin-top: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; } }
button.btn.pop { animation: xp-pop 0.32s ease-out; }
@keyframes xp-pop { 0% { transform: scale(0.96); } 55% { transform: scale(1.04); } 100% { transform: scale(1); } }

/* the live comment: a card under the form */
.preview-card { background: var(--xp-carmanah); border-radius: 1rem; padding: 1rem; margin-top: 2.4rem; scroll-margin-top: 1rem; }
.preview-card h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.6rem; }
.preview-card #output-box { background: var(--xp-dark); border-radius: 0.8rem; padding: 0.85rem 0.9rem; font-size: 0.9rem; line-height: 1.5; overflow-wrap: anywhere; }
.preview-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-top: 0.7rem; flex-wrap: wrap; }
.preview-foot .next-step { margin: 0; flex: 1 1 12rem; }
.preview-foot .next-step:empty { display: none; }
.preview-foot .link-btn { margin-left: auto; }
.missing { color: inherit; opacity: 0.75; border-bottom: 1px dotted rgba(255,178,28,0.8); padding: 0 0.1rem; font-weight: 400; cursor: pointer; }
/* it only gets loud when someone tries to copy before finishing */
#output-box.loud .missing { background: var(--xp-orange); color: var(--xp-dark); opacity: 1; border-bottom: 0; border-radius: 0.25rem; padding: 0 0.3rem; font-weight: 600; }
.field.jump-flash, .light-block.jump-flash { animation: jump-flash 1.5s ease-out; border-radius: 0.6rem; }
@keyframes jump-flash { 0%, 30% { box-shadow: 0 0 0 4px rgba(255,178,28,0.75); } 100% { box-shadow: 0 0 0 4px rgba(255,178,28,0); } }

/* progress: a thin line on the bottom bar and one on the comment card; the comment glows when it is ready */
.progress { height: 6px; border-radius: 3px; background: rgba(var(--xp-green-rgb),0.22); overflow: hidden; margin: 0 0 0.8rem; }
.progress > span { display: block; height: 100%; width: 0; background: var(--xp-green); border-radius: 3px; transition: width 0.4s ease; }
.progress.full > span { box-shadow: 0 0 10px var(--xp-green); }
.sticky-bar .progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; margin: 0; border-radius: 0; }
.sticky-bar .progress > span { border-radius: 0; }
.preview-card #output-box.perfect { animation: xp-glow 2.4s ease-in-out infinite; }
@keyframes xp-glow { 0%,100% { box-shadow: 0 0 0 2px rgba(var(--xp-green-rgb),0.55), 0 0 6px rgba(var(--xp-green-rgb),0.25); } 50% { box-shadow: 0 0 0 2px var(--xp-green), 0 0 18px rgba(var(--xp-green-rgb),0.6); } }

/* bottom bar: Copy Comment plus one helper button (Preview, Next Missing, or Start Next Job) */
.sticky-inner.bar { grid-template-columns: minmax(0, 1fr) auto; }
.sticky-inner.bar .btn.secondary { font-size: 0.9rem; padding: 0.55rem 0.9rem; }
@media (max-width: 359px) { .sticky-inner.bar .btn { font-size: 0.92rem; padding-left: 0.6rem; padding-right: 0.6rem; } }

/* toast: Undo after clearing, and the offer to restore an unfinished job */
.toast { position: fixed; left: 50%; bottom: calc(var(--bar-h) + 0.7rem); transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 0.7rem; width: max-content; max-width: calc(100vw - 1.8rem); padding: 0.5rem 0.5rem 0.5rem 1rem; border-radius: 0.9rem; background: var(--xp-dark); color: var(--xp-white); border: 2px solid var(--xp-green); box-shadow: 0 10px 30px rgba(0,0,0,0.3); font-size: 0.9rem; animation: toast-in .22s ease-out; }
.toast[hidden] { display: none; }
.toast.out { opacity: 0; transform: translate(-50%, 8px); transition: opacity .2s, transform .2s; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.toast-msg { line-height: 1.35; }
.toast button { font: inherit; cursor: pointer; border: 0; -webkit-tap-highlight-color: transparent; }
.toast-act { flex: none; font-weight: 700; min-height: 2.75rem; padding: 0.4rem 0.95rem; border-radius: 0.6rem; background: var(--xp-green); color: var(--xp-dark); }
.toast-x { flex: none; background: none; color: inherit; opacity: 0.75; font-size: 1.35rem; line-height: 1; min-width: 2.75rem; min-height: 2.75rem; }

/* Additional Comments: one bullet per line, with a character count */
.comment-meta { display: flex; justify-content: space-between; gap: 0.6rem; margin-top: 0.4rem; font-size: 0.8rem; opacity: 0.85; }
.comment-meta .over { color: var(--xp-orange); font-weight: 700; opacity: 1; }

/* first-visit name prompt */
.name-dialog .name-hint { font-size: 0.85rem; opacity: 0.85; margin: -0.5rem 0 0.9rem; }
.name-dialog input { width: 100%; }
.name-dialog .sub-q { margin: 0.7rem 0 0.35rem; }

/* footer: version (opens the change log), name, and a Settings panel */
footer.app-footer { margin-top: 2.2rem; padding-bottom: 0.5rem; }

.footer-note { max-width: 30rem; margin: 0.2rem auto 0; font-size: 0.7rem; line-height: 1.45; opacity: 0.85; }
.settings-btn { display: inline-flex; align-items: center; gap: 0.45rem; min-height: 2.75rem; padding: 0 1rem; margin-bottom: 0.4rem; border-radius: 1.4rem; font: 600 0.85rem var(--xp-font); color: var(--xp-white); background: var(--xp-carmanah); border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.settings-panel { max-width: 22rem; margin: 0.2rem auto 0.8rem; padding: 0.8rem 0.9rem 0.6rem; border-radius: 1rem; background: var(--xp-carmanah); color: var(--xp-white); text-align: left; font-size: 0.9rem; animation: xp-pop-in 0.18s ease-out; }

/* change log and the small surprise cards */
.changelog, .thanks { position: fixed; inset: 0; z-index: 110; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(var(--xp-dark-rgb),0.75); }
.changelog-card { width: 100%; max-width: 34rem; max-height: min(85vh, 44rem); display: flex; flex-direction: column; background: var(--xp-white); color: var(--xp-dark); border-radius: 1rem; box-shadow: 0 0 0 3px var(--xp-green), 0 12px 40px rgba(0,0,0,0.4); animation: xp-pop-in 0.3s ease-out; text-align: left; }

.changelog-head h2 { font-size: 1.25rem; color: var(--xp-carmanah); }
.changelog-body { overflow-y: auto; padding: 0.2rem 1.2rem 0.8rem; -webkit-overflow-scrolling: touch; }

.thanks-card { max-width: 24rem; background: var(--xp-white); color: var(--xp-dark); border-radius: 1rem; padding: 1.4rem 1.4rem 1.2rem; text-align: center; box-shadow: 0 0 0 3px var(--xp-green), 0 12px 40px rgba(0,0,0,0.4); animation: xp-pop-in 0.35s ease-out; }
.thanks-card h2 { color: var(--xp-carmanah); margin-bottom: 0.6rem; font-size: 1.2rem; }
.thanks-card p { line-height: 1.5; margin: 0 0 1rem; }
.thanks-card .btn { width: 100%; }
@keyframes xp-pop-in { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* the logo: tap it (it bounces and chimes), and it stretches after ten idle minutes */
header.app-header .header-top img { cursor: pointer; touch-action: manipulation; transform-origin: 50% 60%; }
header.app-header .header-top img.spin { animation: xp-spin 0.7s ease-in-out; }
@keyframes xp-spin { 0% { transform: scale(1) rotate(0); } 50% { transform: scale(1.35) rotate(360deg); } 100% { transform: scale(1) rotate(720deg); } }
header.app-header .header-top img.yawn { transform-origin: 50% 100%; animation: xp-yawn 2.6s ease-in-out; }
@keyframes xp-yawn { 0%, 100% { transform: scale(1, 1) rotate(0); } 30% { transform: scale(0.94, 1.14) rotate(-3deg); } 55% { transform: scale(0.94, 1.14) rotate(3deg); } 75% { transform: scale(1.04, 0.95) rotate(0); } }

/* OLED black: dark mode on a true black page (saves battery on OLED screens); tiles become a deep green-grey */
:root[data-fn-theme="dark"][data-oled="on"] { --xp-dark: #000000; --xp-carmanah: #1A302B; --xp-dark-rgb: 0,0,0; }

/* switching colour mode fades instead of snapping (the class is only on the page for a moment) */
:root.theme-fade, :root.theme-fade *, :root.theme-fade *::before, :root.theme-fade *::after {
  transition: background-color .4s ease, color .4s ease, border-color .4s ease, box-shadow .4s ease, opacity .4s ease !important;
}
:root.theme-fade .ts-knob { transition: transform .15s, background-color .4s ease !important; }

/* light theme pieces for the new parts */

:root[data-fn-theme="light"] .settings-panel .ts-track { background: var(--xp-soft-line); }
:root[data-fn-theme="light"] .settings-panel .theme-switch[aria-checked="true"] .ts-track { background: var(--xp-green); }
:root[data-fn-theme="light"] .preview-foot .link-btn { box-shadow: inset 0 0 0 2px var(--xp-soft-line); }
:root[data-fn-theme="light"] .toast { background: var(--xp-dark); color: var(--xp-white); }

/* ---- retro mode (hidden): the 2020 Xplornet website look, in place of the greens ---- */
:root[data-retro="on"] { --xp-dark: #0A2E52; --xp-carmanah: #1A75BC; --xp-green: #29B0E7; --xp-solar: #6DD0F7; --xp-green-rgb: 41,176,231; --xp-dark-rgb: 10,46,82; --xp-font: 'Myriad Pro', 'Myriad', 'Segoe UI', system-ui, sans-serif; }
:root[data-retro="on"][data-fn-theme="dark"][data-oled="on"] { --xp-dark: #000000; --xp-carmanah: #12426E; --xp-dark-rgb: 0,0,0; }
:root[data-retro="on"][data-fn-theme="light"] { --xp-dark: #333D47; --xp-carmanah: #0079C1; --xp-green: #0079C1; --xp-solar: #33A0DA; --xp-mint: #FFFFFF; --xp-soft-line: #DADFE4; --xp-green-rgb: 0,121,193; --xp-dark-rgb: 51,61,71; --xp-lift: 0 0 0 1px #A9CBE3; --retro-foot: #E3E3E3; }
:root[data-retro="on"][data-fn-theme="dark"] { --retro-foot: #071E38; }
.retro-hero { display: none; }
:root[data-retro="on"] .retro-hero { display: block; position: relative; overflow: hidden; color: #fff; background: linear-gradient(100deg, #0F78BF 0%, #1B5CA4 55%, #1E468A 100%); }
:root[data-retro="on"] .retro-hero::before { content: ""; position: absolute; inset: 0; opacity: 0.9; background: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='110' height='300' viewBox='0 0 110 300'%3E%3Cpolygon points='0,0 50,0 110,150 50,300 0,300 60,150' fill='%23ffffff' fill-opacity='0.13'/%3E%3C/svg%3E") repeat-x right center / 80px 100%; -webkit-mask-image: linear-gradient(90deg, transparent 25%, #000 85%); mask-image: linear-gradient(90deg, transparent 25%, #000 85%); }
.retro-hero-inner { position: relative; max-width: 44rem; margin: 0 auto; padding: 1rem 0.9rem 1.1rem; }
.retro-hero h2 { margin: 0 0 0.3rem; font-size: 1.55rem; font-weight: 300; line-height: 1.15; color: #fff !important; }
.retro-hero h2 span { opacity: 0.55; margin: 0 0.2em; font-weight: 200; }
.retro-cta { margin-top: 0.5rem; font-family: var(--xp-font); font-size: 1rem; font-weight: 600; text-transform: uppercase; color: #fff; background: #7FC241; border: 0; border-radius: 4px; min-height: 2.75rem; padding: 0.5rem 1.3rem; cursor: pointer; }
:root[data-retro="on"] header.app-header { border-bottom: 8px solid #0079C1; }
:root[data-retro="on"] header.app-header h1 { font-weight: 400; }
:root[data-retro="on"] header.app-header img { width: 11rem; background: #fff; border-radius: 4px; }
:root[data-retro="on"] .form-section-title { font-weight: 400; font-size: 1.35rem; }
:root[data-retro="on"] .choice, :root[data-retro="on"] .check, :root[data-retro="on"] input[type="text"], :root[data-retro="on"] textarea { border-radius: 4px; }
:root[data-retro="on"] button.btn { border-radius: 4px; text-transform: uppercase; letter-spacing: 0.02em; }
:root[data-retro="on"] button.btn.primary, :root[data-retro="on"] button.btn.done, :root[data-retro="on"] .toast-act { background: #7FC241; color: #fff; }
:root[data-retro="on"] button.btn.primary.ready { background: #6DB02F; color: #fff; }
:root[data-retro="on"] button.btn.secondary { background: #0079C1; color: #fff; box-shadow: none; }
:root[data-retro="on"] .progress > span { background: #7FC241; }
:root[data-retro="on"] .preview-card { border-radius: 6px; }
:root[data-retro="on"] footer.app-footer { padding: 1rem 0 1.2rem; box-shadow: 0 0 0 100vmax var(--retro-foot); clip-path: inset(0 -100vmax); background: var(--retro-foot); }
:root[data-retro="on"][data-fn-theme="light"] header.app-header { background: #fff; }
:root[data-retro="on"][data-fn-theme="light"] header.app-header h1 { color: #0079C1; }
:root[data-retro="on"][data-fn-theme="light"] header.app-header p { color: #555; }
:root[data-retro="on"][data-fn-theme="light"] header.app-header img { background: none; border-radius: 0; }
:root[data-retro="on"][data-fn-theme="light"] .form-section-title { color: #0079C1; border-bottom-color: #E1E6EA; }
:root[data-retro="on"][data-fn-theme="light"] .choice, :root[data-retro="on"][data-fn-theme="light"] .check { color: #0079C1; }

:root[data-retro="on"][data-fn-theme="dark"] .choice[aria-checked="true"], :root[data-retro="on"][data-fn-theme="dark"] .check[aria-checked="true"] { background: #0A8AD8; color: #fff; box-shadow: none; }
:root[data-retro="on"][data-fn-theme="dark"] input[type="text"], :root[data-retro="on"][data-fn-theme="dark"] textarea { background: #0C3763; box-shadow: inset 0 0 0 1px #3E7DB5; }

@media (prefers-reduced-motion: reduce) {
  .slide-in, .slide-out, button.btn.pop, .toast, .field.jump-flash, .light-block.jump-flash, .changelog-card, .thanks-card, .settings-panel,
  header.app-header .header-top img.spin, header.app-header .header-top img.yawn, .preview-card #output-box.perfect { animation: none; }
  .toast.out { transition: none; }
  :root.theme-fade, :root.theme-fade *, :root.theme-fade *::before, :root.theme-fade *::after { transition: none !important; }
}


/* a + / - button in front of a reading that can be negative (SINR) */
.sign-btn { flex: 0 0 3.4rem; width: 3.4rem; min-height: 3.4rem; border: 0; border-radius: 0.8rem; font: 700 1.4rem/1 var(--xp-font); color: var(--xp-dark); background: var(--xp-green); cursor: pointer; -webkit-tap-highlight-color: transparent; }
:root[data-fn-theme="light"] .sign-btn { background: var(--xp-dark); color: var(--xp-white); }
.job-section .form-section-title { margin-bottom: 0.9rem; }
.job-field .choices.cols-3 .choice { font-size: 0.95rem; }
.job-field .sub-q.first { margin-top: 0; }
.choice:disabled { opacity: 0.35; cursor: not-allowed; }
.choice:disabled:active { background: inherit; color: inherit; }
/* until the job is picked: grey placeholder sections where the questions will load */
.ghost-form { margin-top: 0.4rem; pointer-events: none; user-select: none; -webkit-user-select: none; }
.ghost-note { margin: 0 0 1.2rem; opacity: 0.6; font-size: 0.95rem; }
.ghost-sec { margin-bottom: 1.6rem; opacity: 0.5; animation: ghost-in 0.5s ease-out both; }
.ghost-sec:nth-of-type(3) { animation-delay: 0.08s; } .ghost-sec:nth-of-type(4) { animation-delay: 0.16s; }
.ghost-title { font-weight: 700; font-size: 1.05rem; padding-bottom: 0.45rem; margin-bottom: 0.8rem; border-bottom: 2px solid currentColor; opacity: 0.55; }
.ghost-pills { display: flex; gap: 0.6rem; margin-bottom: 0.7rem; }
.ghost-pill { flex: 1; height: 2.6rem; border-radius: 0.8rem; background: rgba(120,140,130,0.28); }
.ghost-bars { display: grid; gap: 0.55rem; margin-bottom: 0.9rem; }
.ghost-bar { display: block; height: 0.9rem; border-radius: 0.45rem; background: rgba(120,140,130,0.28); }
.ghost-bar.short { width: 60%; }
@keyframes ghost-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 0.5; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ghost-sec { animation: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

/* ---------- drop route tool: the route draws itself down the card, stop by stop ---------- */
.route-tool { --rt-buried: #7A5A2E; --rt-aerial: #2D6FA3; --rt-rail: 1.05rem;
  background: var(--xp-white); border-radius: 0.9rem; box-shadow: 0 1px 3px rgba(0,43,43,.22); padding: 0.85rem 0.85rem 0.7rem; color: var(--xp-dark); }
.rt-ask { margin: 0 0 0.5rem; font-weight: 600; font-size: 0.95rem; }
.rt-stop { display: flex; align-items: center; gap: 0.65rem; min-height: 2rem; }
.rt-stop { min-height: 2.75rem; }   /* every stop is as tall as a stop to pick, so a picked one lands exactly where it was */   /* the same height as the MPT choice rows, so the picked one lands exactly where it was */
.rt-pin { flex: 0 0 auto; width: 0.95rem; height: 0.95rem; margin-left: calc(var(--rt-rail) - 0.475rem); border-radius: 50%; background: var(--xp-white); box-shadow: inset 0 0 0 3px var(--xp-dark); }
.rt-start .rt-pin { background: var(--xp-dark); }
.rt-home .rt-pin { width: 1.4rem; height: 1.4rem; margin-left: calc(var(--rt-rail) - 0.7rem); margin-right: -0.225rem; background: var(--xp-green); box-shadow: none; }
.rt-home .rt-pin::after { content: "\2713"; display: block; text-align: center; line-height: 1.4rem; font-size: 0.8rem; font-weight: 700; }
.rt-stop-name { font-weight: 700; font-size: 1.02rem; flex: 1 1 auto; min-width: 0; }
.rt-mpt { font-size: 0.72rem; font-weight: 700; letter-spacing: .04em; padding: 0.15rem 0.4rem; border-radius: 0.35rem; background: var(--xp-dark); color: var(--xp-white); vertical-align: 0.1rem; }
.rt-input { margin-top: 0.45rem; }
.rt-link { margin-left: calc(var(--rt-rail) - 1.5px); border-left: 3px solid var(--rt-buried); padding: 0.55rem 0 0.55rem 1.05rem; }
.rt-link.rt-aerial { border-left-style: dashed; border-left-color: var(--rt-aerial); }
.rt-link-label { font-size: 0.78rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--rt-buried); }
.rt-link.rt-aerial .rt-link-label { color: var(--rt-aerial); }
.rt-pending { border-left-style: dotted; }
/* a drawn line is as tall as the line still to draw (with its type buttons), so the stops below don't move when it is drawn */
.rt-link { box-sizing: border-box; min-height: 3.5rem; display: flex; align-items: center; gap: 1rem; padding-top: 0.5rem; padding-bottom: 0.5rem; }
.rt-pending.rt-aerial { border-left-style: dashed; }
.rt-types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.4rem; width: 100%; max-width: 20rem; }
.rt-type { padding: 0 0.3rem; }
.rt-type:disabled { opacity: 0.3; cursor: default; }
.rt-ghost[aria-disabled="true"] { opacity: 0.35; cursor: default; }
.rt-ghost[aria-disabled="true"]:active { background: none; }
.rt-ghost[aria-disabled="true"]:active .rt-pin { background: var(--xp-white); }
.route-tool { position: relative; }
.rt-type-chosen { --rt-x: var(--rt-buried); display: inline-flex; align-items: center; justify-content: center; min-height: 2.5rem; padding: 0; margin: 0; border: 0; border-radius: 2rem;
  font-family: var(--xp-font); font-size: 0.78rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--rt-x); background: transparent; box-shadow: none; cursor: pointer;
  transition: transform 0.34s cubic-bezier(.3,.7,.2,1) 0.05s; -webkit-tap-highlight-color: transparent; }
.rt-type-chosen.rt-aerial { --rt-x: var(--rt-aerial); }
.rt-type-chosen.rt-duct { --rt-x: var(--rt-duct); }
.rt-pill-gone { position: absolute; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; pointer-events: none; animation: rt-pill-out 0.22s ease-in both; }
@keyframes rt-pill-out { to { opacity: 0; transform: scale(0.92); } }
.rt-ring { color: transparent !important; background: transparent !important; animation: rt-ring-out 0.26s ease-out both; }
@keyframes rt-ring-out { to { opacity: 0; transform: scale(1.06); } }
.rt-wake { animation: rt-wake 0.35s ease-out 0.1s both; }
@keyframes rt-wake { from { opacity: 0.35; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .rt-type-chosen { transition: none; } .rt-pill-gone, .rt-wake { animation: none; } }
.rt-link .rt-link-label { min-width: 4.4rem; }
.rt-pending .rt-type-chosen { margin-right: auto; }
.rt-pending .rt-type-chosen + .rt-flag { position: absolute; left: calc(1.05rem + 4.4rem + 1rem); }   /* same spot as on a drawn span */
.rt-pending { position: relative; }   /* ticks line up whatever the span type */
.route-tool .rt-flag { width: auto; min-height: 2.5rem; padding: 0 0.2rem; font-size: 0.9rem; font-weight: 600; color: var(--xp-dark); }
.route-tool .rt-flag .mini-box { flex-basis: 1.25rem; width: 1.25rem; height: 1.25rem; border-color: var(--xp-carmanah); }
.route-tool .rt-flag[aria-checked="true"] .mini-box { background: var(--xp-green); border-color: var(--xp-green); color: var(--xp-dark); }
.rt-nudge { animation: rt-nudge 0.45s ease-in-out; }
@keyframes rt-nudge { 0%, 100% { transform: none; } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

.route-tool { --rt-duct: #4F5D66; }
.rt-link.rt-duct { border-left: 5px double var(--rt-duct); margin-left: calc(var(--rt-rail) - 2.5px); }
.rt-link.rt-duct .rt-link-label, .rt-group.rt-duct .rt-group-label { color: var(--rt-duct); }
.rt-type.rt-duct { color: var(--rt-duct); box-shadow: inset 0 0 0 2px var(--rt-duct); }
.rt-type[aria-checked="true"].rt-duct { background: var(--rt-duct); color: var(--xp-white); }
.rt-pending.rt-unset { border-left-color: var(--xp-soft-line, #C7D9CF); border-left-style: dotted; }
.rt-type { font-family: var(--xp-font); font-size: 0.78rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; min-height: 2.5rem; padding: 0 0.3rem;
  border: 0; border-radius: 2rem; background: var(--xp-white); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.rt-type.rt-buried { color: var(--rt-buried); box-shadow: inset 0 0 0 2px var(--rt-buried); }
.rt-type.rt-aerial { color: var(--rt-aerial); box-shadow: inset 0 0 0 2px var(--rt-aerial); }

<script>
var APP_VERSION = '2.15.27';
/* ===================== helpers ===================== */
function $(id) { return document.getElementById(id); }

function el(tag, attrs, children) {
  var node = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'class') node.className = attrs[k];

    else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);

    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

var store = {
  get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { window.localStorage.removeItem(k); } catch (e) {} },
  ok: function () { try { var k = '__xp_test'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); return true; } catch (e) { return false; } }
};

function cap(t) { t = String(t || '').trim(); return t ? t.charAt(0).toUpperCase() + t.slice(1) : ''; }
function lowerFirst(t) { t = String(t || '').trim(); return t ? t.charAt(0).toLowerCase() + t.slice(1) : ''; }
function str(v) { return String(v === undefined || v === null ? '' : v).trim(); }
function calm() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

/* ===================== state ===================== */
var OLD_DRAFT_KEY = 'xplore_fsl_draft_fibre_existing_v16';   // before 2.6 the job was saved here; it is moved to WIP_KEY once
var OLD_WIP_KEY = 'xplore_fsl_wip_v1';   // 2.6: one form only, no job saved
// inside an SA the form is kept under Field Kit's own key, tagged with the SA it belongs to (1.20.79)
var WIP_IN_SA = !!(window.FieldKit && FieldKit.job && FieldKit.job.inMode());
var WIP_KEY = WIP_IN_SA ? FieldKit.job.notesKey : 'xplore_fsl_wip_v2';
var NAME_FIRST_KEY = 'xplore_fsl_tech_first_name';
var NAME_LAST_KEY = 'xplore_fsl_tech_last_name';
var NAME_ASKED_KEY = 'xplore_fsl_name_asked';

var STATE = {};
var ERRORS = [];            // [{id, label, msg}]; only filled once they try to copy (or a light reading needs checking)
var COPIED = false;         // the finished comment has been copied
var COPY_FLASH = false, FLASH_TIMER = null;
var PENDING_FOCUS = null;   // field id whose "Other" box should grab focus after the next render
var LIGHT_PROMPT = false;   // true once they've moved on with a light level that needs checking

/* Additional Comments: set this to FSL's comment limit to show "used / limit" and warn when over. 0 = just count. */
var COMMENT_LIMIT = 0;

function getName() { return { first: str(store.get(NAME_FIRST_KEY)), last: str(store.get(NAME_LAST_KEY)) }; }
function hasAnswers(st) {
  if (!st || typeof st !== 'object') return false;
  return Object.keys(st).some(function (k) {
    var v = st[k];
    if (v && typeof v === 'object') return Object.keys(v).some(function (kk) { return !!v[kk]; });
    return v !== undefined && v !== null && v !== '' && v !== false;
  });
}

/* ===================== error handling ===================== */
function errFor(id) { for (var i = 0; i < ERRORS.length; i++) if (ERRORS[i].id === id) return ERRORS[i]; return null; }

function jumpTo(id) {
  if (id === 'tech') { askName(); return; }
  var node = document.querySelector('#form-mount [data-field-id="' + id + '"]');
  if (!node) return;
  node.scrollIntoView({ behavior: calm() ? 'auto' : 'smooth', block: 'center' });
  var focusable = node.querySelector('input, textarea, button');
  if (focusable) { try { focusable.focus({ preventScroll: true }); } catch (e) {} }
  node.classList.remove('jump-flash'); void node.offsetWidth; node.classList.add('jump-flash');
  setTimeout(function () { node.classList.remove('jump-flash'); }, 1600);
}

function clearError(id) {
  var before = ERRORS.length;
  ERRORS = ERRORS.filter(function (e) { return e.id !== id; });
  if (ERRORS.length === before) return;
  var node = document.querySelector('#form-mount [data-field-id="' + id + '"]');
  if (node) {
    node.classList.remove('has-error');
    // a card can hold another flagged field (light level inside the ONT card): only remove this field's own note
    var msgs = node.querySelectorAll('.field-error-msg');
    for (var i = 0; i < msgs.length; i++) { if (msgs[i].closest('[data-field-id]') === node) { msgs[i].remove(); break; } }
  }
}

/* a change was made by the tech */
function changed(fieldId, rerender) {
  if (fieldId) clearError(fieldId);
  COPIED = false; COPY_FLASH = false;
  if (rerender) render();
  updatePreview();
  wipDropOffer(); wipSave();
  finishedCheck();
}
/* In a Field Kit SA: the moment the last question is answered, glide down to the finished comment.
   If that last answer was typed, wait until the keyboard is put away (the box loses focus). */
var WAS_DONE = null;
function notesDone() { return !!jobKey() && !validate().filter(function (i) { return i.id !== 'tech'; }).length; }
function finishedCheck() {
  if (!(window.FieldKit && FieldKit.job && FieldKit.job.inMode && FieldKit.job.inMode())) return;
  var done = notesDone(), was = WAS_DONE; WAS_DONE = done;
  if (!done || was !== false) return;   // only when it goes from not-done to done
  var a = document.activeElement;
  var go = function () { setTimeout(function () { if (notesDone()) showPreviewIfAbove(); }, 350); };
  if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'radio') a.addEventListener('blur', go, { once: true });
  else go();

/* ===================== field wrappers ===================== */
function fieldWrap(id, label, optional, hint, controls) {
  var e = errFor(id);
  var wrap = el('div', { class: 'field' + (e ? ' has-error' : ''), 'data-field-id': id });
  if (label) wrap.appendChild(el('span', { class: 'q' }, [label, optional ? el('span', { class: 'opt', text: ' (optional)' }) : null]));
  if (hint) wrap.appendChild(el('p', { class: 'hint', text: hint }));
  controls.forEach(function (c) { if (c) wrap.appendChild(c); });
  if (e) wrap.appendChild(el('div', { class: 'field-error-msg', text: e.msg }));
  return wrap;
}

function choiceGroup(key, options, cols, fieldId, afterChange, off) {
  var group = el('div', { class: 'choices' + (cols ? ' cols-' + cols : ''), role: 'radiogroup' });
  options.forEach(function (o) {
    var selected = STATE[key] === o;
    var btn = el('button', {
      type: 'button', class: 'choice', role: 'radio', 'aria-checked': selected ? 'true' : 'false',
      onclick: function () {
        STATE[key] = o;

        if (afterChange) afterChange(o);
        changed(fieldId, true);
      }

    if (off && off(o)) { btn.disabled = true; btn.setAttribute('aria-disabled', 'true'); }   // greyed out, kept in place for muscle memory
    group.appendChild(btn);

function otherInput(key, fieldId, label) {

  var inp = el('input', { type: 'text', 'aria-label': label, autocomplete: 'off' });
  inp.value = STATE[key] || '';

  return el('div', { class: 'other-input', 'data-anim': key }, [el('p', { class: 'sub-q', text: label }), inp]);
}

function choiceField(o) {
  // o: {id, key, label, hint, options, cols, other, otherLabel}
  var controls = [choiceGroup(o.key, o.options, o.cols, o.id)];
  if (o.other && STATE[o.key] === 'Other') controls.push(otherInput(o.key + '_other', o.id, o.otherLabel));
  return fieldWrap(o.id, o.label, o.optional, o.hint, controls);
}

/* a small tick box under a question (own router, splice already done, reused patch) */
function miniCheck(key, label, anim) {

/* ===================== live comment, progress, copy ===================== */

  var FIBRE_EXISTING = { job_type: 'Install', job_plat: 'Fibre', job_drop: 'Existing Drop', job_outcome: 'Complete' };
  var old = store.get(OLD_DRAFT_KEY);
  if (old) {
    try { var o = JSON.parse(old); if (hasAnswers(o) && !store.get(WIP_KEY)) store.set(WIP_KEY, JSON.stringify({ at: Date.now(), state: Object.assign(o, FIBRE_EXISTING) })); } catch (e) {}

    try { var o1 = JSON.parse(old1); if (o1 && hasAnswers(o1.state) && !store.get(WIP_KEY)) { o1.state = Object.assign(o1.state, FIBRE_EXISTING); store.set(WIP_KEY, JSON.stringify(o1)); } } catch (e) {}

  if (!d || !hasAnswers(d.state) || !d.at || Date.now() - d.at > WIP_MAX) { wipClear(); return; }

function systemTheme() { return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
function oledOn() { return document.documentElement.getAttribute('data-oled') === 'on'; }
function applyTheme(remember) {

  document.documentElement.setAttribute('data-fn-theme', t);
  var group = $('theme-choices');

  var meta = document.querySelector('meta[name="theme-color"]');

}
function initTheme() {
  var group = $('theme-choices');
  [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].forEach(function (m) {

  $('oled-switch').addEventListener('click', function () {
    var on = !oledOn(); fadeTheme();

  function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(); } }

    return el('section', {}, [

  var btn = el('button', { type: 'button', class: 'btn primary', text: 'Close', onclick: close });

}

var AUDIO = null;
var TING_STEPS = [0, 2, 4, 7, 9, 12, 14, 16];   // a pentatonic climb, so fast clicking sounds like a little tune
function tone(freq, when, len, vol) {
  var o = AUDIO.createOscillator(), o2 = AUDIO.createOscillator(), g = AUDIO.createGain(), t0 = AUDIO.currentTime + when;
  o.type = 'sine'; o.frequency.value = freq; o2.type = 'sine'; o2.frequency.value = freq * 2.76;   // bell-like overtone
  var g2 = AUDIO.createGain(); g2.gain.value = 0.25; o2.connect(g2); g2.connect(g); o.connect(g); g.connect(AUDIO.destination);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
  o.start(t0); o2.start(t0); o.stop(t0 + len + 0.05); o2.stop(t0 + len + 0.05);
}
function ting(step, big) {
  try {
    if (!AUDIO) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; AUDIO = new AC(); }
    if (AUDIO.state === 'suspended') AUDIO.resume();
    var f = 880 * Math.pow(2, TING_STEPS[step % TING_STEPS.length] / 12);
    if (big) { tone(f, 0, 0.7, 0.07); tone(f * 1.5, 0.12, 0.9, 0.07); tone(f * 2, 0.24, 1.1, 0.06); }   // a little chime
    else tone(f, 0, 0.35, 0.05);
  } catch (e) { /* no sound is fine */ }
}

/* After the first five clicks the logo becomes a piano. Each click plays the next chord in a repeating cycle of 16:
     8 x  C - E - A      3 x  B - E - A  (the bottom note steps down from C to B)      5 x  B - E - G  (the top note steps down from A to G)
   The player's timing is the rhythm. Click 50 is the finale. Semitones are counted above E3. */
var PIANO_CYCLE = [
  { n: 8, notes: [8, 12, 17] },   // C4 E4 A4
  { n: 3, notes: [7, 12, 17] },   // B3 E4 A4
  { n: 5, notes: [7, 12, 15] }    // B3 E4 G4
];
function pianoChord(step) {
  var pos = step % 16, c = PIANO_CYCLE[0];
  for (var k = 0; k < PIANO_CYCLE.length; k++) { c = PIANO_CYCLE[k]; if (pos < c.n) break; pos -= c.n; }
  return c.notes;
}
var NOISE = null;
function noiseBurst(len, vol, type, freq) {
  if (!NOISE) { NOISE = AUDIO.createBuffer(1, AUDIO.sampleRate, AUDIO.sampleRate); var d = NOISE.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  var src = AUDIO.createBufferSource(), f = AUDIO.createBiquadFilter(), g = AUDIO.createGain(), t0 = AUDIO.currentTime;
  src.buffer = NOISE; f.type = type; f.frequency.value = freq; src.connect(f); f.connect(g); g.connect(AUDIO.destination);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len); src.start(t0); src.stop(t0 + len + 0.02);
}
function pluck(freq, type, vol, len, cutoff) {
  var t0 = AUDIO.currentTime, o = AUDIO.createOscillator(), f = AUDIO.createBiquadFilter(), g = AUDIO.createGain();
  o.type = type; o.frequency.value = freq;
  f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t0); f.frequency.exponentialRampToValueAtTime(300, t0 + len * 0.9);
  o.connect(f); f.connect(g); g.connect(AUDIO.destination);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
  o.start(t0); o.stop(t0 + len + 0.05);

(function () {

/* The logo reacts like a spring: every click adds a push to whatever it is already doing, so fast clicking makes it

function logoSpring(logo) {

    st.vs += (-K * st.s - C * st.vs) * dt; st.s += st.vs * dt;

    if (still) { logo.style.transform = ''; running = false; return; }
    logo.style.transform = 'translateY(' + st.y.toFixed(2) + 'px) rotate(' + st.r.toFixed(2) + 'deg) scale(' + (1 + st.s).toFixed(3) + ')';

/* The logo: every tap chimes (made in the browser, no audio file). Five quick taps bring a thank-you, then each tap plays

var EGG_CLICKS = 50;
function initThanks() {

/* Two quiet surprises: the logo stretches after ten idle minutes, and a long press on the footer line shows the credits. */

/* Retro mode: a hidden surprise. The Konami code (up up down down left right left right B A) turns the page into the old

/* Opened as part of a Field Kit SA (from Field Cam or the SA page): the questions at the top are already answered from

function skipAnswered() {

  if (touchedEarly || (window.pageYOffset || 0) > 40 || !jobKey()) return;
  var todo = validate().filter(function (i) { return i.id !== 'tech'; });
  var node = todo.length ? document.querySelector('#form-mount [data-field-id="' + todo[0].id + '"]') : $('preview');
  if (!node) return;
  var sec = node.closest && node.closest('.form-section');
  if (sec && sec.querySelector('[data-field-id]') === node) node = sec;   // first question of its section: show the section title too
