<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Field Kit</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#002B2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Kit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!--
  The Field Kit shell (1.20.81, step 3 of the one-app rebuild; was the big-screen frame of 1.20.61).
  Every Field Kit page runs in a frame here. Home, Field Stock and Manual Order stay loaded, so moving between them is
  instant; Field Cam and Comments load fresh each time, and the old screen stays up until the new one is ready.
  Big screens: the same, in a phone-sized box in the middle. Off switch: Settings > Instant switching.
  Pages talk to it through window.__fkShell (see fieldkit.js); it tells them when they're shown or hidden
  (FieldKit._host) and owns the Back button.
-->
<style>
  html,body{margin:0;height:100%}
  html{background:#F2F5F3}
  html[data-theme="dark"]{background:#0A1615}
  html[data-theme="black"]{background:#000}
  body{overflow:hidden;background:transparent}
  /* the pages can't see the phone's notch / home bar from inside a frame, so the frames stop short of them */
  /* 1.20.89: the pages fill the whole screen, like before the shell, and keep clear of the notch and home bar
     themselves: the shell hands each page the screen's safe areas (--fk-sa-*), so bars run to the edges (no unused strip) */
  #stage{position:fixed;inset:0;overflow:hidden}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;visibility:hidden;pointer-events:none;background:transparent}
  #stage iframe.on{visibility:visible;pointer-events:auto;z-index:1}
  #stage.busy iframe.on{pointer-events:none}
  /* phone turned sideways: iPhone web apps can't be locked upright, so the shell turns the app back, like rotation lock
     (1.20.85). Field Cam does its own turning (photos still come out landscape), so it's left alone while it's on screen. */
  html.srot #stage{top:0;left:0;right:auto;bottom:auto;width:var(--rh);height:var(--rw);transform-origin:0 0}
  html.srot90 #stage{transform:rotate(-90deg) translateX(-100%)}
  html.srot270 #stage{transform:rotate(90deg) translateY(-100%)}
  #inset{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  #toast{position:fixed;left:50%;bottom:calc(var(--sab,0px) + 96px);transform:translate(-50%,10px);z-index:5;max-width:calc(100% - 40px);
    padding:10px 16px;border-radius:12px;background:#0E2A27;color:#F2F5F3;font:600 15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  /* big screens: a phone-sized box in the middle */
  html.big{background:#D6E0DC}
  html.big[data-theme="dark"]{background:#05100F}
  html.big[data-theme="black"]{background:#000}
  html.big body{display:grid;place-items:center}
  html.big #stage{position:relative;inset:auto;width:412px;height:min(calc(100vh - 48px),915px);border-radius:28px;
    box-shadow:0 18px 50px rgba(0,40,30,.22),0 2px 8px rgba(0,40,30,.12)}
  html.big[data-theme="dark"] #stage{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.5)}
  html.big[data-theme="black"] #stage{box-shadow:0 0 0 1px rgba(255,255,255,.12)}
  html.big #toast{bottom:40px}
</style>
</head>
<body>
<div id="stage"><div id="toast" role="status" aria-live="polite"></div></div>
<div id="inset"></div>
<script>
(function () {
  "use strict";
  var BIGQ = "(min-width:600px) and (min-height:700px)";   // keep in step with fieldkit.js
  var PAGES = /^(index|fieldcam|fieldstock|fieldnotes)\.html$/;
  var stage = document.getElementById("stage"), de = document.documentElement;
  var mode = ""; try { mode = localStorage.getItem("fieldkit.shell") || ""; } catch (e) {}
  var KEEP = mode !== "off";                             // off: no pages kept loaded (big screens only, as in 1.20.61)
  function isBig() { return matchMedia(BIGQ).matches && Math.min(screen.width || 0, screen.height || 0) >= 600; }
  function theme() { try { var t = localStorage.getItem("techstock.theme"); if (t) de.setAttribute("data-theme", t); } catch (e) {} }
  theme(); de.classList.toggle("big", isBig());

  // only Field Kit's own pages
  function clean(u) {
    u = String(u || "");
    var m = /^([^?#]*)(\?[^#]*)?(#.*)?$/.exec(u) || [];
    var page = (m[1] || "").split("/").pop() || "index.html";
    if (!PAGES.test(page)) page = "index.html";
    return page + (m[2] || "") + (m[3] || "");
  }
  function pageOf(u) { return u.split(/[?#]/)[0]; }
  function hashOf(u) { var i = u.indexOf("#"); return i < 0 ? "" : u.slice(i); }
  // which frame a page goes in: kept ones by name; everything else gets a fresh frame each time
  function keyOf(u) {
    if (!KEEP) return "t:" + pageOf(u);
    var p = pageOf(u), h = hashOf(u);
    if (p === "index.html") return "home";
    if (p === "fieldstock.html" && (h === "" || h === "#log")) return "stock";
    if (p === "fieldstock.html" && /^#order/.test(h)) return "order";
    // Field Cam and Comments (1.20.82): Field Cam on its own, and Pictures / Comments inside the SA
    if (u === "fieldcam.html") return "cam";
    if (u === "fieldcam.html#job") return "camsa";
    if (u === "fieldnotes.html#job") return "notessa";
    return "t:" + p;
  }
  function kept(k) { return k.indexOf("t:") !== 0; }

  var start = clean(new URLSearchParams(location.search).get("u"));
  function back(u) { try { sessionStorage.setItem("fieldkit.noFrameUntil", String(Date.now() + 10000)); } catch (e) {} location.replace(u); }
  if (!KEEP && !isBig()) { back(start); return; }      // switched off, on a phone: plain pages

  /* ---------- frames ---------- */
  var frames = {}, cur = null, showSeq = 0;
  function win(f) { try { return f.el.contentWindow; } catch (e) { return null; } }
  function host(f, show) {
    if (show) f.el.removeAttribute("data-fk-hidden"); else f.el.setAttribute("data-fk-hidden", "1");
    var w = win(f); try { if (w && w.FieldKit) w.FieldKit._host(show); } catch (e) {}
  }
  function make(k, url, hidden) {
    var el = document.createElement("iframe");
    el.title = "Field Kit";
    el.setAttribute("allow", "camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; accelerometer; gyroscope; magnetometer; screen-wake-lock");
    el.setAttribute("allowfullscreen", "");
    if (hidden) el.setAttribute("data-fk-hidden", "1");
    el.setAttribute("aria-hidden", "true");
    var f = { k: k, url: url, el: el, ready: false, waits: [], snap: null };
    el.addEventListener("load", function () {
      var w = win(f);
      try { if (!w || w.location.href === "about:blank") return; } catch (e) { return; }
      f.ready = true;
      try { f.url = clean(w.location.pathname.split("/").pop() + w.location.search + w.location.hash); } catch (e) {}
      if (k !== "home") setTimeout(function () { if (frames[k] === f && f !== cur && f.ready) f.snap = sigOf(k); }, 1500);
      var q = f.waits; f.waits = []; q.forEach(function (fn) { fn(); });
    });
    el.src = url;
    stage.appendChild(el);
    frames[k] = f;
    return f;
  }
  function whenReady(f, fn) {
    if (f.ready) { fn(); return; }
    var done = false, go = function () { if (done) return; done = true; fn(); };
    f.waits.push(go);
    setTimeout(go, 4000);   // never leave the tech on the old screen for long
  }
  function reload(f) { f.ready = false; f.snap = null; try { win(f).location.reload(); } catch (e) { f.el.src = f.url; } }
  function drop(f) { if (!f) return; if (frames[f.k] === f) delete frames[f.k]; try { f.el.remove(); } catch (e) {} }

  // Field Stock's saved data, to tell when a Field Stock page kept in the background is out of date
  function snap() {
    var ks = [];
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if ((/^techstock\./.test(k) && !/^techstock\.(gs|draft|lastTab)$/.test(k)) || k === "fieldkit.profile" || k === "fieldkit.prefs") ks.push(k); } } catch (e) {}
    ks.sort();
    var h = 5381, s, j;
    for (var n = 0; n < ks.length; n++) { s = ks[n] + "=" + (localStorage.getItem(ks[n]) || "") + "\n"; for (j = 0; j < s.length; j++) h = ((h << 5) + h + s.charCodeAt(j)) | 0; }
    return ks.length + ":" + h;
  }
  /* Field Cam and Comments kept in the background (1.20.82): what each one shows that another page can change.
     A page's own saving happens as it's hidden, before this is taken, so it never makes itself out of date.
     Comments doesn't care about Field Cam's photo counts, and Pictures doesn't care about Comments' answers
     (except how many XWH / XTV), so going back and forth between them doesn't reload either one. */
  function raw(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function hash(s) { var h = 5381; for (var j = 0; j < s.length; j++) h = ((h << 5) + h + s.charCodeAt(j)) | 0; return s.length + ":" + h; }
  function stable(v) {
    if (v === null || typeof v !== "object") return JSON.stringify(v === undefined ? null : v);
    if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
    return "{" + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ":" + stable(v[k]); }).join(",") + "}";
  }
  var COMMON = ["fieldkit.profile", "fieldkit.prefs", "techstock.theme"];
  // an empty value is the same as none ({} vs null slots after Field Cam first saves the SA)
  function put(o, k, v) { if (v == null || v === "" || (typeof v === "object" && !Object.keys(v).length)) return; o[k] = v; }
  function activeJob() {
    var id = raw("fieldkit.activeJob"); if (!id) return null;
    try { return (JSON.parse(raw("fieldkit.jobs") || "{}") || {})[id] || null; } catch (e) { return null; }
  }
  function sigOf(k) {
    if (k === "stock" || k === "order") return snap();
    var parts = COMMON.map(raw), j, o, n;
    if (k === "cam") parts.push(raw("fieldcam.jobs"), raw("fieldcam.current"), raw("fieldcam.settings"));
    else if (k === "camsa") {
      j = activeJob(); o = {};
      if (j) Object.keys(j).forEach(function (x) { if (x !== "notes" && x !== "step" && x !== "updated") put(o, x, j[x]); });
      n = (j && j.notes && j.notes.state) || {};
      parts.push(raw("fieldkit.activeJob"), raw("fieldcam.jobs"), raw("fieldcam.settings"), raw("fieldkit.camInJob"), stable(o), stable([n.xwh, n.tv]));
    } else if (k === "notessa") {
      j = activeJob(); o = {};
      if (j) ["sa", "work", "plat", "tech", "vas", "base", "outcome", "reason", "labels", "serials", "slots", "status"].forEach(function (x) { put(o, x, j[x]); });
      if (j && j.notes) Object.keys(j.notes).forEach(function (x) { if (x !== "state") put(o, "n." + x, j.notes[x]); });
      parts.push(raw("fieldkit.activeJob"), raw("fieldkit.notesInJob"), stable(o));
      try { for (var i = 0; i < localStorage.length; i++) { var key = localStorage.key(i); if (/^xplore_fsl_/.test(key) && key !== "xplore_fsl_wip_v2") parts.push(key + "=" + raw(key)); } } catch (e) {}
    }
    if (window.__fkSigDebug) (window.__fkSigLog = window.__fkSigLog || []).push([k, parts.slice()]);
    return hash(parts.join("\n"));
  }
  function stale(f) { return f.k !== "home" && kept(f.k) && f.ready && f.snap !== null && f.snap !== sigOf(f.k); }

  // put a page on screen; route: send home to this screen ("#job", "" for the menu…) once it's showing
  function show(url, route) {
    url = clean(url);
    var k = keyOf(url), f = frames[k];
    if (!kept(k)) {
      if (f && f === cur && f.url === url) { finish(f, route); return; }
      if (f && f !== cur) drop(f);
      f = make(k, url, false);                         // a fresh page about to be shown: it starts as shown (camera starts sooner)
    } else if (!f) f = make(k, url, cur !== null);
    else if (f !== cur && stale(f)) reload(f);
    var mine = ++showSeq;
    if (f !== cur) stage.classList.add("busy");
    whenReady(f, function () { if (mine === showSeq) swap(f, route); });
  }
  function swap(f, route) {
    stage.classList.remove("busy");
    var old = cur;
    if (old && old !== f) {
      try { var ad = win(old).document.activeElement; if (ad && ad.blur) ad.blur(); } catch (e) {}
      host(old, false);
      old.el.classList.remove("on"); old.el.setAttribute("aria-hidden", "true");
      if (old.k !== "home" && kept(old.k)) old.snap = sigOf(old.k);   // its own changes (saved as it was hidden) don't make it out of date
      if (!kept(old.k)) drop(old);
    }
    cur = f;
    upright();
    f.el.classList.add("on"); f.el.removeAttribute("aria-hidden");
    if (old !== f) host(f, true);
    finish(f, route);
  }
  function finish(f, route) {
    var w = win(f);
    if (route !== undefined && f.k === "home") { routing = true; try { if (w.__fkRoute) w.__fkRoute(route); } catch (e) {} routing = false; }
    try { document.title = w.document.title || "Field Kit"; var th = w.document.documentElement.getAttribute("data-theme"); if (th) de.setAttribute("data-theme", th); } catch (e) {}
    try { w.focus(); } catch (e) {}
    if (f.k === "home") refreshSoon();
    preload();
  }
  // Field Stock pages kept in the background: bring them up to date while the tech is on the home screen
  // (also when Field Stock's saved data changes while one is hidden; at most once every 5 s per page, the rest waits for show)
  var rt = 0;
  function refreshSoon(ms) {
    clearTimeout(rt);
    rt = setTimeout(function () {
      ["stock", "order", "camsa", "notessa"].forEach(function (k) {
        var f = frames[k]; if (!f || f === cur || !cur) return;
        if (cur.k !== "home" && (k === "camsa" || k === "notessa" || cur.k === "cam" || cur.k === "camsa")) return;   // not while the camera's on screen; Pictures / Comments only from home
        if ((k === "camsa" || k === "notessa") && !activeJob()) { drop(f); return; }   // the SA was completed
        if (stale(f) && Date.now() - (f.at || 0) > 5000) { f.at = Date.now(); reload(f); }
      });
      preloadSA();
    }, ms || 600);
  }
  /* An SA is open: load Pictures, then Comments, in the background so they open instantly (the camera doesn't
     start until Pictures is on screen). Only while the tech is on the home page. */
  function preloadSA() {
    if (!KEEP || !preloaded || !activeJob() || !cur || cur.k !== "home") return;
    var todo = ["fieldcam.html#job", "fieldnotes.html#job"].filter(function (u) { return !frames[keyOf(u)]; });
    if (!todo.length) return;
    var u = todo[0], wait = setTimeout(function () {
      if (frames[keyOf(u)] || !cur || cur.k !== "home" || !activeJob()) return;
      var f = make(keyOf(u), u, true); whenReady(f, function () { setTimeout(preloadSA, 1200); });
    }, 1500);
  }
  // after the first screen is up: load home, Field Stock and Manual Order in the background, one at a time
  var preloaded = false;
  function preload() {
    if (preloaded || !KEEP) return; preloaded = true;
    var list = ["index.html", "fieldstock.html", "fieldstock.html#order"];
    (function next() {
      var u = list.shift(); if (!u) return;
      if (frames[keyOf(u)]) { next(); return; }
      setTimeout(function () { if (frames[keyOf(u)]) { next(); return; } var f = make(keyOf(u), u, true); whenReady(f, next); }, 1200);
    })();
    setTimeout(refreshSoon, 6000);   // then Pictures and Comments, if an SA is open
  }

  /* ---------- history: one entry per page change; Back goes to the previous page ---------- */
  var stack = [start], pos = 0, pendingRoute = null;
  var routing = false, silentBack = false;
  // home changed screen by itself (iPhone only): record it as a history entry, or step back one if it's the screen before
  function screen(w, url) {
    if (!IOS || routing || !cur || cur.k !== "home" || win(cur) !== w || url === stack[pos]) return;
    if (pos > 0 && stack[pos - 1] === url) { silentBack = true; history.back(); return; }
    // Start SA turns New SA into the SA page, and finishing setup turns into the menu: those replace, not add
    if (/#(new-job|setup)$/.test(stack[pos])) { stack[pos] = url; try { history.replaceState({ fk: url, i: pos }, "", addr(url)); } catch (e) {} return; }
    stack = stack.slice(0, pos + 1); stack.push(url); pos++;
    try { history.pushState({ fk: url, i: pos }, "", addr(url)); } catch (e) {}
  }
  var IOS = window.__fkIOS != null ? !!window.__fkIOS : (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));
  function addr(u) { return "frame.html?u=" + encodeURIComponent(u); }
  try { history.replaceState({ fk: start, i: 0 }, "", addr(start)); } catch (e) {}
  function samePage(a, b) { var ka = keyOf(a), kb = keyOf(b); return ka === kb && (kept(ka) || pageOf(a) === pageOf(b)); }
  function nav(url, replace) {
    url = clean(url);
    if (cur && kept(cur.k) && keyOf(url) === cur.k) {   // same page, another screen of it
      // iPhone (1.20.85): no Back button, only the swipe, which slides between real history entries. So each home screen
      // (menu, SA page, New SA, settings…) gets its own entry, and the swipe shows the screen it's going back to.
      if (IOS && cur.k === "home" && url !== stack[pos]) {
        if (!replace && pos > 0 && stack[pos - 1] === url) { pendingRoute = url; pendingFrom = pos; history.back(); return; }
        if (replace) { stack[pos] = url; try { history.replaceState({ fk: url, i: pos }, "", addr(url)); } catch (e) {} }
        else { stack = stack.slice(0, pos + 1); stack.push(url); pos++; try { history.pushState({ fk: url, i: pos }, "", addr(url)); } catch (e) {} }
      }
      show(url, cur.k === "home" ? hashOf(url) : undefined); return;
    }
    // going to the page just before (e.g. "‹ Field Kit"): a real Back, so history doesn't keep growing
    if (!replace && pos > 0 && samePage(stack[pos - 1], url)) { pendingRoute = url; pendingFrom = pos; history.back(); return; }
    if (replace) { stack[pos] = url; try { history.replaceState({ fk: url, i: pos, guard: guard ? 1 : undefined }, "", addr(url)); } catch (e) {} }
    else {
      stack = stack.slice(0, pos + 1); stack.push(url); pos++;
      try { history.pushState({ fk: url, i: pos }, "", addr(url)); } catch (e) {}
      guard = false;
    }
    show(url, keyOf(url) === "home" ? hashOf(url) : undefined);
  }
  /* The phone's Back button. A spare history entry sits on top of the current page (added on a tap, as Chrome requires).
     Back lands there first: the page closes whatever is open (a panel, the scanner…), or the shell goes to the previous
     page. On the home screen's menu the first Back says "Press back again to close Field Kit"; the next one closes it. */
  var guard = false, lastWarn = 0, pendingFrom = -1;
  function touched(w) {
    if (IOS) return;   // iPhone: no Back button to catch, and a spare entry made the swipe slide to a copy of the same screen
    if (guard || !cur || win(cur) !== w) return;
    try { history.pushState({ fk: stack[pos], i: pos, guard: 1 }, "", addr(stack[pos])); guard = true; } catch (e) {}
  }
  function pageBack() {
    var w = win(cur);
    try { if (w.__fkBack && w.__fkBack()) return; } catch (e) {}
    if (cur.k === "home") {
      var onMenu = true; try { onMenu = !w.document.getElementById("menu").hidden; } catch (e) {}
      if (!onMenu) { try { w.__fkRoute(""); } catch (e) {} return; }
      if (pos > 0) { history.back(); return; }
      if (Date.now() - lastWarn > 2500) { lastWarn = Date.now(); toast("Press back again to close Field Kit"); }
      return;
    }
    try { if (w.FieldKit && w.FieldKit.goHome && cur.k !== "stock" && cur.k !== "order") { w.FieldKit.goHome(); return; } } catch (e) {}
    nav("index.html");
  }
  addEventListener("popstate", function (e) {
    var st = e.state;
    if (!st || st.fk === undefined) return;
    var np = st.i || 0;
    if (silentBack) { silentBack = false; pos = np; return; }   // home already shows this screen
    if (pendingRoute) {
      if (np >= pendingFrom) { history.back(); return; }          // stepped off a spare entry: keep going back
      pos = np; guard = !!st.guard;
      var url = pendingRoute; pendingRoute = null;
      show(url, keyOf(url) === "home" ? hashOf(url) : undefined);
      return;
    }
    if (np === pos && guard && !st.guard) { guard = false; pageBack(); return; }   // Back pressed on this page
    pos = np; guard = !!st.guard;
    if (!stack[pos] || !samePage(stack[pos], st.fk)) stack[pos] = st.fk;
    show(st.fk, IOS && keyOf(st.fk) === "home" ? hashOf(st.fk) : undefined);
  });

  var tt = 0;
  function toast(t) { var el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove("show"); }, 2200); }

  window.__fkShell = { nav: function (u, r) { nav(u, r); }, touched: touched, toast: toast, screen: screen, insets: function () { if (!insetsReady) { insetsReady = true; upright(); } return INS; } };
  var insetsReady = false;

  // a new version has taken over: reload the whole app (the pages leave this to the shell)
  try {
    if (navigator.serviceWorker) {
      var had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", function () { if (had) location.reload(); had = true; });
    }
  } catch (e) {}
  matchMedia(BIGQ).addEventListener("change", function () { de.classList.toggle("big", isBig()); upright(); });
  function upright() {
    var a = 0; try { a = (screen.orientation && typeof screen.orientation.angle === "number") ? screen.orientation.angle : (typeof window.orientation === "number" ? (window.orientation + 360) % 360 : 0); } catch (e) {}
    if (window.__forceAngle != null) a = window.__forceAngle;   // tests
    var touch = window.__forceAngle != null || matchMedia("(pointer:coarse)").matches, cam = !!cur && pageOf(cur.url) === "fieldcam.html";
    var r = !isBig() && touch && !cam && innerWidth > innerHeight && (a === 90 || a === 270) ? a : 0;
    de.classList.toggle("srot", !!r); de.classList.toggle("srot90", r === 90); de.classList.toggle("srot270", r === 270);
    var cs = getComputedStyle(document.getElementById("inset")), t = parseFloat(cs.paddingTop) || 0, rt = parseFloat(cs.paddingRight) || 0, b = parseFloat(cs.paddingBottom) || 0, l = parseFloat(cs.paddingLeft) || 0;
    var st = de.style; st.setProperty("--rw", innerWidth + "px"); st.setProperty("--rh", innerHeight + "px");
